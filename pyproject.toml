[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-edge400"
version = "0.1.0"
description = "Auditable configuration and structural accounting for Unified Edge"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.6.0", "PyYAML==6.0.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
edge-config = "unified_edge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["overfit: fixed 60-update CPU learning and post-checkpoint generation gate"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
